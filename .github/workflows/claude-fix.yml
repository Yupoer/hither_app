name: Claude Fix

# Trusted maintainer dispatch: the CI workflow may still add `claude-fix` as a triage
# label, but public issue events must not directly start a write-capable agent. Claude
# receives only a maintainer-authored task summary and cannot run commands while the
# provider credential is present. A fresh secretless job verifies the candidate, and a
# separate publish job imports its commits into a clean checkout and opens a draft PR.
#
# REQUIRED SECRET: ANTHROPIC_API_KEY  (Settings > Secrets and variables > Actions).
# Each run is a billed API call. Review the issue, then describe the requested behavior
# in your own words; do not paste issue content into the trusted summary.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number selected by a trusted maintainer"
        required: true
        type: number
      task_summary:
        description: "Maintainer-authored task summary; do not paste issue content"
        required: true
        type: string

jobs:
  claude:
    if: inputs.issue_number > 0
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      start_sha: ${{ steps.start.outputs.sha }}
      has_commits: ${{ steps.bundle.outputs.has_commits }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: master
          persist-credentials: false

      - name: Record starting commit
        id: start
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@4036a180cf690f49529f5d8c79c998855287f590 # v1 tag release commit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          github_token: ${{ github.token }}
          base_branch: master
          prompt: |
            You are fixing GitHub issue #${{ inputs.issue_number }} from this trusted,
            maintainer-authored task summary:

            <task-summary>
            ${{ inputs.task_summary }}
            </task-summary>

            Do not retrieve the issue, its comments, or linked CI logs. Inspect the repository
            and make the smallest correct source change for the summary. Command execution is
            intentionally unavailable while the provider credential is present.

            The app lives in `apps/mobile` (React Native + Expo SDK 57, Supabase backend).
            Read `CLAUDE.md` first and follow its rules. Native access belongs behind
            `src/native/` with a JS fallback. Keep Platform.OS branching out of UI components.
            Map the acceptance criteria for #${{ inputs.issue_number }} to existing or
            updated tests in `apps/mobile/src/__tests__/acceptance-map.json`.

            Do not run commands, commit, push, open a PR, or merge. A later secretless job
            commits and verifies the candidate before a separate job opens a draft PR.
          claude_args: >-
            --allowedTools
            "Edit,Read,Write,Glob,Grep"
            --disallowedTools
            "Bash,WebFetch,WebSearch,mcp__github__*"

      - name: Commit candidate changes
        env:
          ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git config user.name "claude-fix[bot]"
          git config user.email "claude-fix[bot]@users.noreply.github.com"
          git add --all
          git -c core.hooksPath=/dev/null commit -m "Claude fix for #${ISSUE}"

      - name: Bundle agent commits
        id: bundle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fix"
          start="${{ steps.start.outputs.sha }}"
          if [ "$(git rev-list --count "$start..HEAD")" -gt 0 ]; then
            git bundle create "$RUNNER_TEMP/fix/fix.bundle" "$start..HEAD"
            echo "has_commits=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: steps.bundle.outputs.has_commits == 'true'
        with:
          name: claude-fix
          path: ${{ runner.temp }}/fix
          retention-days: 7

  verify:
    needs: claude
    if: needs.claude.outputs.has_commits == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: master
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: claude-fix
          path: ${{ runner.temp }}/fix

      - name: Check out candidate
        env:
          START_SHA: ${{ needs.claude.outputs.start_sha }}
        run: |
          set -euo pipefail
          [[ "$START_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$START_SHA" HEAD
          git bundle verify "$RUNNER_TEMP/fix/fix.bundle"
          git fetch --no-tags "$RUNNER_TEMP/fix/fix.bundle" "HEAD:refs/claude-fix/candidate"
          git merge-base --is-ancestor "$START_SHA" refs/claude-fix/candidate
          git checkout --detach refs/claude-fix/candidate

      - name: Verify agent workflow boundary
        run: python3 -B scripts/test_claude_fix_security.py

      - uses: ./.github/actions/setup-mobile

      - name: Verify candidate
        working-directory: apps/mobile
        env:
          COVERAGE_BASE: ${{ needs.claude.outputs.start_sha }}
          META_PARENT: ${{ inputs.issue_number }}
        run: |
          bun run check:quick -- --base "$COVERAGE_BASE"
          bun run test:meta
          bun run test:ci
          bun run verify:runtime
          bunx --no-install expo install --check

  publish:
    needs: [claude, verify]
    if: needs.claude.outputs.has_commits == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: master
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: claude-fix
          path: ${{ runner.temp }}/fix

      - name: Publish fix branch and open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
          REPO: ${{ github.repository }}
          START_SHA: ${{ needs.claude.outputs.start_sha }}
        run: |
          set -euo pipefail
          start="$START_SHA"
          [[ "$start" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$start" HEAD
          git bundle verify "$RUNNER_TEMP/fix/fix.bundle"
          git fetch --no-tags "$RUNNER_TEMP/fix/fix.bundle" "HEAD:refs/claude-fix/incoming"
          git merge-base --is-ancestor "$start" refs/claude-fix/incoming
          branch="claude-fix/issue-${ISSUE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "refs/claude-fix/incoming:refs/heads/${branch}"
          body="$(printf 'Automated fix proposal for #%s from workflow run %s. Review before merging.\n\n<!-- hither-test-meta parent: %s -->' "$ISSUE" "$GITHUB_RUN_ID" "$ISSUE")"
          gh pr create --repo "$REPO" --draft --base master --head "$branch" \
            --title "Claude fix for #${ISSUE}" --body "$body"
