name: Agent testers

# Claude Code agents use a Simulator build of Hither as personas from
# pierridotite/mobile-agent-testers (pinned below) and write bug reports.
# The repo is public, so the app, build log and reports are encrypted before
# upload. Decrypt locally with: bash scripts/agent-testers-collect.sh <run id>

on:
  workflow_dispatch:
    inputs:
      ios_personas:
        description: "Personas: Hither's (meiling, chihao) or upstream iOS ids (clara, jonas, noah, yuki, wei...), comma-separated, or all"
        default: "meiling,chihao"
      ref:
        description: Hither branch, tag or full SHA to build (empty = the dispatched commit)
        default: ""
      brief:
        description: "Agent brief: hither-brief.md, AGENT_BRIEF.md, briefs/improve.md, or briefs/reproduce.md with bug_report"
        default: hither-brief.md
      bug_report:
        description: "Bug to reproduce instead of exploring: an issue (owner/repo#123 or URL) or the steps as text"
        default: ""
      model:
        description: "Model: sonnet, opus, haiku or a full Claude id"
        default: sonnet
      record_video:
        description: Record each Simulator screen (encrypted with the results)
        type: boolean
        default: false

permissions:
  contents: read
  issues: read

concurrency:
  group: agent-testers
  cancel-in-progress: false

env:
  TESTERS_REPO: pierridotite/mobile-agent-testers
  TESTERS_SHA: d610b95a1670aa6031aa23cfa8cd8987ce478abf
  CLAUDE_CODE_VERSION: 2.1.331
  BLOCK_HOSTS: "app.posthog.com eu.i.posthog.com us.i.posthog.com graph.facebook.com api.mixpanel.com api2.amplitude.com"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.matrix.outputs.ios }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ env.TESTERS_REPO }}
          ref: ${{ env.TESTERS_SHA }}
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: .github/agent-testers
          path: hither
          persist-credentials: false
      - name: Check secrets
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
          CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.AGENT_TESTERS_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.AGENT_TESTERS_SUPABASE_ANON_KEY }}
        run: |
          missing=()
          [ -n "$ARTIFACT_PASSPHRASE" ] || missing+=(ARTIFACT_PASSPHRASE)
          [ -n "$CLAUDE_AUTH" ] || missing+=("CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY")
          [ -n "$SUPABASE_URL" ] || missing+=(AGENT_TESTERS_SUPABASE_URL)
          [ -n "$SUPABASE_ANON_KEY" ] || missing+=(AGENT_TESTERS_SUPABASE_ANON_KEY)
          test -s hither/.github/agent-testers/results_public.pem || missing+=(".github/agent-testers/results_public.pem")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing: %s\n' "${missing[@]}"
            exit 1
          fi
      - name: Merge Hither personas
        run: bash hither/.github/agent-testers/prepare.sh hither
      - id: matrix
        env:
          PERSONAS: ${{ inputs.ios_personas }}
          PLATFORM: ios
        run: python3 scripts/matrix.py >> "$GITHUB_OUTPUT"

  build-ios:
    needs: plan
    if: needs.plan.outputs.ios != '[]'
    runs-on: xcode-27
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/mobile
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ env.TESTERS_REPO }}
          ref: ${{ env.TESTERS_SHA }}
          path: .agent-testers
          persist-credentials: false

      - name: Verify Xcode 27
        working-directory: .
        run: xcodebuild -version | grep -E '^Xcode 27\.0(\.[0-9]+)?$'

      - name: Pin CocoaPods to checked-in lockfile
        run: |
          [[ "$(tail -n 1 ios/Podfile.lock)" == 'COCOAPODS: 1.16.2' ]] || exit 1
          if ! gem list -i cocoapods -v 1.16.2; then
            gem install cocoapods --version 1.16.2 --user-install --no-document
          fi
          tool_dir="$RUNNER_TEMP/hither-cocoapods"
          mkdir -p "$tool_dir"
          cat > "$tool_dir/pod" <<'SH'
          #!/bin/sh
          exec ruby -e 'require "rubygems"; gem "cocoapods", "= 1.16.2"; load Gem.bin_path("cocoapods", "pod", "= 1.16.2")' -- "$@"
          SH
          chmod +x "$tool_dir/pod"
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.16.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Write test backend environment
        env:
          SUPABASE_URL: ${{ secrets.AGENT_TESTERS_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.AGENT_TESTERS_SUPABASE_ANON_KEY }}
        run: |
          umask 077
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env

      # Build output is private: a public log could expose source paths and keys.
      - name: Build Simulator app
        run: |
          log="$GITHUB_WORKSPACE/results/build-ios.log"
          mkdir -p "$(dirname "$log")"
          bash ../../scripts/install-mobile-dependencies.sh >> "$log" 2>&1
          (cd ios && pod install --deployment) >> "$log" 2>&1
          # The embedded bundle must be the source under test, not a production OTA.
          /usr/libexec/PlistBuddy -c 'Set :EXUpdatesEnabled false' ios/Hither/Supporting/Expo.plist
          xcodebuild -workspace ios/Hither.xcworkspace -scheme Hither -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/agent-testers-dd" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build >> "$log" 2>&1 \
            || { echo '::error::iOS build failed: see the encrypted build log'; exit 1; }
          app="$RUNNER_TEMP/agent-testers-dd/Build/Products/Release-iphonesimulator/Hither.app"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" == app.hither.mobile ]]
          tar czf "$GITHUB_WORKSPACE/app-ios.tgz" -C "$(dirname "$app")" Hither.app

      - name: Encrypt app
        working-directory: .
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: |
          mkdir -p out
          openssl enc -aes-256-cbc -pbkdf2 -salt -in app-ios.tgz -out out/app-ios.tgz.enc -pass env:ARTIFACT_PASSPHRASE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: app-ios
          path: out/
          retention-days: 3

      - name: Encrypt build log
        if: always()
        working-directory: .
        run: |
          cp .github/agent-testers/results_public.pem results_public.pem
          bash .agent-testers/scripts/encrypt_results.sh build-log-ios
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: build-log-ios
          path: results.enc/
          retention-days: 7

      - name: Remove build secrets from runner
        if: always()
        working-directory: .
        run: rm -rf apps/mobile/.env results app-ios.tgz out "$RUNNER_TEMP/agent-testers-dd"

  # GitHub-hosted on purpose: each tester rewrites /etc/hosts and pf rules.
  ios:
    needs: [plan, build-ios]
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.ios) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ env.TESTERS_REPO }}
          ref: ${{ env.TESTERS_SHA }}
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: .github/agent-testers
          path: hither
          persist-credentials: false
      - name: Merge Hither personas and brief
        run: bash hither/.github/agent-testers/prepare.sh hither

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: app-ios
      - name: Decrypt app
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in app-ios.tgz.enc -out app-ios.tgz -pass env:ARTIFACT_PASSPHRASE
          mkdir -p app && tar xzf app-ios.tgz -C app

      - name: Latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Tools (AXe, Pillow, Claude Code)
        run: |
          brew install -q cameroncooke/axe/axe
          python3 -m pip install -q --break-system-packages pillow
          npm install -g --silent "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - name: Block analytics and ad hosts
        run: |
          IPS=""
          for h in $BLOCK_HOSTS; do
            IPS="$IPS $(dig +short A "$h" @8.8.8.8 | grep -E '^[0-9.]+$' | tr '\n' ' ')"
            printf '0.0.0.0 %s\n:: %s\n' "$h" "$h" | sudo tee -a /etc/hosts >/dev/null
          done
          [ -n "${IPS// /}" ] && echo "block drop out quick proto { tcp udp } to { $(echo $IPS | tr ' ' ',') }" | sudo pfctl -a com.apple/agentblock -f - 2>/dev/null
          sudo pfctl -E 2>/dev/null || true
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true

      - name: Simulator
        env:
          MODEL_NAME: ${{ matrix.simulator }}
          IOS_MAJOR: ${{ matrix.ios }}
          LOCALE: ${{ matrix.locale }}
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          python3 scripts/ios/create_sim.py "$MODEL_NAME" "$IOS_MAJOR" | tee -a "$GITHUB_ENV" > "$RUNNER_TEMP/sim.env"
          UDID=$(grep '^UDID=' "$RUNNER_TEMP/sim.env" | cut -d= -f2)
          xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b >/dev/null
          d() { xcrun simctl spawn "$UDID" defaults write "$@"; }
          L="${LOCALE:-en-US}"
          d -g AppleLanguages -array "$L"; d -g AppleLocale -string "${L/-/_}"
          # Synthetic key events use US key codes; another layout remaps typed text and shortcuts.
          d -g AppleKeyboards -array "en_US@sw=QWERTY;hw=US"
          d com.apple.Preferences KeyboardLastUsed -string "en_US@sw=QWERTY;hw=US"
          for k in KeyboardAutocapitalization KeyboardAutocorrection KeyboardPrediction KeyboardCheckSpelling; do d com.apple.Preferences $k -bool NO; done
          for k in DidShowContinuousPathIntroduction KeyboardDidShowProductivityTutorial DidShowGestureKeyboardIntroduction; do
            d com.apple.Preferences $k -bool YES; d com.apple.keyboard.preferences $k -bool YES
          done
          xcrun simctl shutdown "$UDID" && xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b >/dev/null

      - name: Bug report to reproduce
        if: inputs.bug_report != ''
        env:
          BUG_REPORT: ${{ inputs.bug_report }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/bug_report.sh

      - name: Agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERSONA: ${{ matrix.persona }}
          TEXT_SIZE: ${{ matrix.text_size }}
          THEME: ${{ matrix.theme }}
          LOCALE: ${{ matrix.locale }}
          GEO: ${{ matrix.geo }}
          DEVICE: ${{ matrix.simulator }}
          APP_ID: app.hither.mobile
          BRIEF: ${{ inputs.bug_report != '' && inputs.brief == 'hither-brief.md' && 'briefs/reproduce.md' || inputs.brief }}
          MODEL: ${{ inputs.model }}
          LLM_BASE_URL: ""
          RECORD_VIDEO: ${{ inputs.record_video }}
        run: bash scripts/ios/run_agent.sh

      - name: Encrypt results
        if: always()
        run: bash scripts/encrypt_results.sh "${{ matrix.persona }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: results-${{ matrix.persona }}
          path: results.enc/
          retention-days: 14
