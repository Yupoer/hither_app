name: CD iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed 40-character commit on master
        required: true
        type: string
      mode:
        description: Inspect release state, verified OTA, quick preflight, full Release validation, signed build, or TestFlight upload
        required: true
        default: preflight
        type: choice
        options:
          - inspect-release
          - ota
          - preflight
          - validate-release
          - build-only
          - submit
      backend_verified:
        description: Confirm required production backend changes are applied and verified before OTA or submit
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ contains(fromJSON('["ota","build-only","submit","validate-release"]'), inputs.mode) && 'cd-ios-production' || format('cd-ios-diagnostic-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false

jobs:
  inventory:
    if: inputs.mode == 'inspect-release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_MODE: ${{ inputs.mode }}
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Validate inventory dispatch
        working-directory: .
        run: |
          [[ "$GITHUB_REF" == refs/heads/master ]] || exit 1
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned inventory source
        id: trusted_source
        working-directory: .
        run: |
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master
      - name: Initialize inventory attempt journal
        working-directory: .
        run: |
          python3 scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase dispatch --status passed
          python3 scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase setup --status unknown
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install inventory dependencies
        run: |
          npm ci
          npx patch-package --error-on-fail
      - name: Read EAS production iOS metadata
        env:
          EXPO_TOKEN: ${{ secrets.HITHER_GITHUB_ACTIONS }}
        run: |
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase inventory --status unknown
          test -n "$EXPO_TOKEN" || { echo 'GitHub Actions HITHER_GITHUB_ACTIONS secret is required for Expo'; exit 1; }
          npx --yes eas-cli@21.0.2 whoami
          npx --yes eas-cli@21.0.2 build:list --platform ios --build-profile production \
            --status finished --distribution store --limit 20 --json --non-interactive \
            > "$RUNNER_TEMP/hither-ios-builds.json"
          npx --yes eas-cli@21.0.2 channel:view production --json --non-interactive \
            > "$RUNNER_TEMP/hither-ios-channel.json"
          npx --yes eas-cli@21.0.2 update:list --branch production --platform ios \
            --limit 1 --json --non-interactive > "$RUNNER_TEMP/hither-ios-updates.json"
          group=$(python3 - "$RUNNER_TEMP/hither-ios-updates.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              page = json.load(stream).get('currentPage', [])
          print(page[0]['group'] if page else '')
          PY
          )
          view_args=()
          if [[ -n "$group" ]]; then
            npx --yes eas-cli@21.0.2 update:view "$group" --json \
              > "$RUNNER_TEMP/hither-ios-update-view.json"
            view_args=(--view "$RUNNER_TEMP/hither-ios-update-view.json")
          fi
          python3 ../../scripts/inspect-ios-release-inventory.py \
            --builds "$RUNNER_TEMP/hither-ios-builds.json" \
            --channel "$RUNNER_TEMP/hither-ios-channel.json" \
            --updates "$RUNNER_TEMP/hither-ios-updates.json" \
            "${view_args[@]}" \
            --receipt "$RUNNER_TEMP/hither-ios-inventory.json"
          test -s "$RUNNER_TEMP/hither-ios-inventory.json"
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase inventory --status passed
      - name: Summarize sanitized inventory receipt
        if: always()
        working-directory: .
        run: |
          if [[ -f "$RUNNER_TEMP/hither-ios-inventory.json" ]]; then
            cat "$RUNNER_TEMP/hither-ios-inventory.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanitized inventory receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hither-ios-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hither-ios-inventory.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Finalize inventory attempt outcome
        if: always()
        working-directory: .
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_TRUSTED: ${{ steps.trusted_source.outcome }}
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, re, tempfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          journal = root / 'hither-ios-cd-journal.jsonl'
          outcome = root / 'hither-ios-cd-outcome.json'
          source = os.environ.get('SOURCE_SHA', '')
          source = source if re.fullmatch(r'[0-9a-f]{40}', source) else None
          mode = os.environ.get('RELEASE_MODE', '')
          mode = mode if mode in {'inspect-release', 'preflight', 'validate-release', 'ota', 'build-only', 'submit'} else None
          helper = Path('scripts/write-ios-cd-outcome.py')
          if os.environ.get('SOURCE_TRUSTED') == 'success' and helper.is_file() and source is not None and mode is not None:
              spec = importlib.util.spec_from_file_location('cd_outcome', helper)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              module.finalize(journal, module.attempt_identity(os.environ), os.environ['JOB_STATUS'], outcome)
          else:
              run_id, attempt = os.environ.get('GITHUB_RUN_ID', ''), os.environ.get('GITHUB_RUN_ATTEMPT', '')
              if not re.fullmatch(r'[1-9][0-9]*', run_id) or not re.fullmatch(r'[1-9][0-9]*', attempt):
                  raise ValueError('invalid GitHub attempt identity')
              event = {'sourceSha': source, 'runId': run_id, 'runAttempt': int(attempt), 'mode': mode,
                       'phase': 'dispatch', 'status': 'unknown' if os.environ['JOB_STATUS'] == 'cancelled' else 'failed'}
              for path in (journal, outcome):
                  with tempfile.NamedTemporaryFile(mode='w', dir=root, delete=False) as stream:
                      json.dump(event, stream, sort_keys=True)
                      stream.write('\n')
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.replace(stream.name, path)
          PY
          cat "$RUNNER_TEMP/hither-ios-cd-outcome.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inventory attempt outcome
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hither-ios-cd-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hither-ios-cd-journal.jsonl
            ${{ runner.temp }}/hither-ios-cd-outcome.json
          if-no-files-found: error
          retention-days: 14

  ios:
    if: inputs.mode != 'inspect-release'
    runs-on: xcode-27
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: apps/mobile
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_MODE: ${{ inputs.mode }}
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Validate trusted dispatch
        working-directory: .
        run: |
          [[ "$GITHUB_REF" == refs/heads/master ]] || { echo 'Dispatch from master only'; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be a full lowercase SHA'; exit 1; }
          [[ "$RELEASE_MODE" == ota || "$RELEASE_MODE" == preflight || "$RELEASE_MODE" == validate-release || "$RELEASE_MODE" == build-only || "$RELEASE_MODE" == submit ]] || exit 1
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo 'A valid GitHub run attempt is required'; exit 1; }
          if [[ "$RELEASE_MODE" == ota || "$RELEASE_MODE" == build-only || "$RELEASE_MODE" == submit ]]; then
            [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || { echo 'Write-mode reruns are blocked; inspect the earlier outcome before a fresh dispatch'; exit 1; }
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned master source and Xcode
        id: trusted_source
        working-directory: .
        run: |
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | grep -E '^Xcode 27\.0(\.[0-9]+)?$'
          sw_vers
          xcrun --sdk iphoneos --show-sdk-version
          xcrun simctl list runtimes

      - name: Initialize iOS attempt journal
        working-directory: .
        run: |
          python3 scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase dispatch --status passed
          python3 scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase setup --status unknown

      - name: Pin CocoaPods to checked-in lockfile
        if: inputs.mode == 'preflight' || inputs.mode == 'validate-release' || inputs.mode == 'build-only' || inputs.mode == 'submit'
        run: |
          [[ "$(tail -n 1 ios/Podfile.lock)" == 'COCOAPODS: 1.16.2' ]] || exit 1
          if ! gem list -i cocoapods -v 1.16.2; then
            gem install cocoapods --version 1.16.2 --user-install --no-document
          fi
          tool_dir="$RUNNER_TEMP/hither-cocoapods"
          mkdir -p "$tool_dir"
          cat > "$tool_dir/pod" <<'SH'
          #!/bin/sh
          exec ruby -e 'require "rubygems"; gem "cocoapods", "= 1.16.2"; load Gem.bin_path("cocoapods", "pod", "= 1.16.2")' -- "$@"
          SH
          chmod +x "$tool_dir/pod"
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
          PATH="$tool_dir:$PATH" pod --version | grep -Fx '1.16.2'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Verify exact-source master CI
        if: inputs.mode == 'ota' || inputs.mode == 'validate-release' || inputs.mode == 'build-only' || inputs.mode == 'submit'
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase ci_admission --status unknown
          node scripts/check-release-ci.mjs >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase ci_admission --status passed

      - name: Install and verify native dependencies
        run: |
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase setup --status unknown
          npm ci
          npx patch-package --error-on-fail
          npm run verify:runtime
          npx --yes eas-cli@21.0.2 --version
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase setup --status passed

      - name: Verify production release prerequisites
        if: inputs.mode == 'ota' || inputs.mode == 'submit'
        env:
          BACKEND_VERIFIED: ${{ inputs.backend_verified }}
        run: |
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase backend_prerequisite --status unknown
          [[ "$BACKEND_VERIFIED" == true ]] || { echo 'Verify production backend deployment before publishing'; exit 1; }
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase backend_prerequisite --status passed

      - name: Verify OTA compatibility and current master
        if: inputs.mode == 'ota'
        working-directory: .
        run: |
          python3 scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase ota_compatibility --status unknown
          [[ "$(git ls-remote origin refs/heads/master | cut -f1)" == "$SOURCE_SHA" ]] || {
            echo 'OTA source must still be the current master commit'; exit 1;
          }
          python3 scripts/check-ios-ota-compatibility.py \
            --source-sha "$SOURCE_SHA" \
            --manifest release/ios-production-binary.json \
            > "$RUNNER_TEMP/hither-ota-compatibility.json" || {
              cat "$RUNNER_TEMP/hither-ota-compatibility.json" >> "$GITHUB_STEP_SUMMARY"
              cat "$RUNNER_TEMP/hither-ota-compatibility.json" >&2
              exit 1
            }
          cat "$RUNNER_TEMP/hither-ota-compatibility.json" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase ota_compatibility --status passed

      - name: Prepare production iOS OTA intent
        if: inputs.mode == 'ota'
        env:
          EXPO_TOKEN: ${{ secrets.HITHER_GITHUB_ACTIONS }}
        run: |
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase setup --status unknown
          test -n "$EXPO_TOKEN" || { echo 'GitHub Actions HITHER_GITHUB_ACTIONS secret is required for Expo'; exit 1; }
          npx --yes eas-cli@21.0.2 whoami
          npx --yes eas-cli@21.0.2 channel:view production --non-interactive --json \
            > "$RUNNER_TEMP/hither-production-channel-before.json"
          python3 ../../scripts/verify-ios-ota-publication.py before \
            --channel "$RUNNER_TEMP/hither-production-channel-before.json"
          [[ "$(git ls-remote origin refs/heads/master | cut -f1)" == "$SOURCE_SHA" ]] || {
            echo 'Master moved before OTA publication'; exit 1;
          }
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" \
            --phase ota_publication --status unknown --intent "$RUNNER_TEMP/hither-ios-cd-intent-ota_publication.json"

      - name: Upload OTA mutation intent
        id: ota_intent_upload
        if: inputs.mode == 'ota'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hither-ios-cd-intent-${{ github.run_id }}-${{ github.run_attempt }}-ota_publication
          path: ${{ runner.temp }}/hither-ios-cd-intent-ota_publication.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish and verify production iOS OTA
        if: inputs.mode == 'ota'
        env:
          EXPO_TOKEN: ${{ secrets.HITHER_GITHUB_ACTIONS }}
          INTENT_RETAINED: ${{ steps.ota_intent_upload.outcome }}
        run: |
          [[ "$INTENT_RETAINED" == success ]] || { echo 'OTA intent retention is required'; exit 1; }
          [[ "$(git ls-remote origin refs/heads/master | cut -f1)" == "$SOURCE_SHA" ]] || {
            echo 'Master moved before OTA publication'; exit 1;
          }
          npx --yes eas-cli@21.0.2 env:exec production \
            "EAS_BUILD_PROFILE=production npx --yes eas-cli@21.0.2 update --channel production --platform ios --environment production --message 'hither release $SOURCE_SHA' --non-interactive --json" \
            --non-interactive > "$RUNNER_TEMP/hither-ota-published.json"
          group=$(python3 ../../scripts/verify-ios-ota-publication.py published \
            --published "$RUNNER_TEMP/hither-ota-published.json" \
            --source-sha "$SOURCE_SHA" \
            --runtime "$(node -p 'require("./app.json").expo.runtimeVersion')")
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase ota_publication --status passed
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase ota_readback --status unknown
          printf 'Published OTA group %s; verifying remote state\n' "$group" >> "$GITHUB_STEP_SUMMARY"
          npx --yes eas-cli@21.0.2 update:view "$group" --json \
            > "$RUNNER_TEMP/hither-ota-view.json"
          npx --yes eas-cli@21.0.2 channel:view production --non-interactive --json \
            > "$RUNNER_TEMP/hither-production-channel-after.json"
          python3 ../../scripts/verify-ios-ota-publication.py after \
            --published "$RUNNER_TEMP/hither-ota-published.json" \
            --view "$RUNNER_TEMP/hither-ota-view.json" \
            --channel "$RUNNER_TEMP/hither-production-channel-after.json" \
            --source-sha "$SOURCE_SHA" \
            --runtime "$(node -p 'require("./app.json").expo.runtimeVersion')" \
            --receipt "$RUNNER_TEMP/hither-ota-receipt.json"
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase ota_readback --status passed
          cat "$RUNNER_TEMP/hither-ota-receipt.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OTA receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: inputs.mode == 'ota'
        with:
          name: hither-ios-ota-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hither-ota-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Build and cold-launch full Release simulator app
        if: inputs.mode == 'validate-release' || inputs.mode == 'build-only' || inputs.mode == 'submit'
        env:
          EXPO_TOKEN: ${{ secrets.HITHER_GITHUB_ACTIONS }}
        run: |
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase release_launch --status unknown
          test -n "$EXPO_TOKEN" || { echo 'GitHub Actions HITHER_GITHUB_ACTIONS secret is required for Expo'; exit 1; }
          npx --yes eas-cli@21.0.2 env:exec production \
            "EAS_BUILD_PROFILE=production python3 ../../scripts/run-ios-release-launch.py --source-sha $SOURCE_SHA --receipt $RUNNER_TEMP/hither-release-launch-receipt.json" \
            --non-interactive
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase release_launch --status passed
          cat "$RUNNER_TEMP/hither-release-launch-receipt.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release launch receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: inputs.mode == 'validate-release' || inputs.mode == 'build-only' || inputs.mode == 'submit'
        with:
          name: hither-ios-release-launch-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hither-release-launch-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload sanitized Release launch failure diagnostic
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure() && (inputs.mode == 'validate-release' || inputs.mode == 'build-only' || inputs.mode == 'submit')
        with:
          name: hither-ios-release-launch-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hither-release-launch-diagnostic.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare signed build intent
        if: inputs.mode == 'build-only' || inputs.mode == 'submit'
        run: |
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" \
            --phase signed_build --status unknown --intent "$RUNNER_TEMP/hither-ios-cd-intent-signed_build.json"

      - name: Upload signed build mutation intent
        id: build_intent_upload
        if: inputs.mode == 'build-only' || inputs.mode == 'submit'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hither-ios-cd-intent-${{ github.run_id }}-${{ github.run_attempt }}-signed_build
          path: ${{ runner.temp }}/hither-ios-cd-intent-signed_build.json
          if-no-files-found: error
          retention-days: 14

      - name: Build signed production IPA on this runner
        if: inputs.mode == 'build-only' || inputs.mode == 'submit'
        env:
          EXPO_TOKEN: ${{ secrets.HITHER_GITHUB_ACTIONS }}
          INTENT_RETAINED: ${{ steps.build_intent_upload.outcome }}
        run: |
          [[ "$INTENT_RETAINED" == success ]] || { echo 'Signed build intent retention is required'; exit 1; }
          test -n "$EXPO_TOKEN" || { echo 'GitHub Actions HITHER_GITHUB_ACTIONS secret is required for Expo'; exit 1; }
          npx --yes eas-cli@21.0.2 whoami
          npx --yes eas-cli@21.0.2 build --platform ios --profile production --local \
            --non-interactive --output "$RUNNER_TEMP/Hither-production.ipa"
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase signed_build --status passed

      - name: Verify IPA and record source
        if: inputs.mode == 'build-only' || inputs.mode == 'submit'
        run: |
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase ipa_verification --status unknown
          ipa="$RUNNER_TEMP/Hither-production.ipa"
          test -s "$ipa"
          unzip -tq "$ipa" >/dev/null
          ditto -x -k "$ipa" "$RUNNER_TEMP/hither-ipa"
          shopt -s nullglob
          apps=("$RUNNER_TEMP/hither-ipa/Payload/"*.app)
          [[ ${#apps[@]} -eq 1 ]]
          app=${apps[0]}
          [[ "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" == app.hither.mobile ]]
          widgets=("$app/PlugIns/"*.appex)
          [[ ${#widgets[@]} -eq 1 ]]
          widget=${widgets[0]}
          [[ "$(plutil -extract CFBundleIdentifier raw "$widget/Info.plist")" == app.hither.mobile.widget ]]
          codesign --verify --deep --strict "$app"
          python3 - "$app/Expo.plist" "$app/Info.plist" "$RUNNER_TEMP/hither-release-launch-receipt.json" <<'PY'
          import json, os, plistlib, sys
          from pathlib import Path
          config = json.loads(Path('app.json').read_text())['expo']
          with open(sys.argv[1], 'rb') as stream:
              updates = plistlib.load(stream)
          with open(sys.argv[2], 'rb') as stream:
              info = plistlib.load(stream)
          launch = json.loads(Path(sys.argv[3]).read_text())
          assert updates.get('EXUpdatesEnabled') is True
          assert updates.get('EXUpdatesRuntimeVersion') == config['runtimeVersion']
          assert updates.get('EXUpdatesURL') == config['updates']['url']
          assert updates.get('EXUpdatesRequestHeaders', {}).get('expo-channel-name') == 'production'
          assert info.get('CFBundleShortVersionString') == config['version'] == launch['appVersion']
          assert launch['sourceSha'] == os.environ['SOURCE_SHA']
          assert launch['validationScope'] == 'source_equivalent_release_simulator'
          print('Signed IPA source version, updates channel, and runtime match Release simulator gate')
          PY
          version=$(plutil -extract CFBundleShortVersionString raw "$app/Info.plist")
          build=$(plutil -extract CFBundleVersion raw "$app/Info.plist")
          runtime=$(plutil -extract EXUpdatesRuntimeVersion raw "$app/Expo.plist")
          [[ "$build" =~ ^[0-9]+$ ]]
          digest=$(shasum -a 256 "$ipa" | cut -d ' ' -f 1)
          printf 'source_sha=%s\nmode=%s\nversion=%s\nbuild=%s\nruntime=%s\nchannel=%s\nipa_sha256=%s\nrun_id=%s\n' \
            "$SOURCE_SHA" "$RELEASE_MODE" "$version" "$build" "$runtime" production "$digest" "$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/hither-receipt.txt"
          cat "$RUNNER_TEMP/hither-receipt.txt" >> "$GITHUB_STEP_SUMMARY"
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase ipa_verification --status passed

      - name: Upload build receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: inputs.mode == 'build-only' || inputs.mode == 'submit'
        with:
          name: hither-ios-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hither-receipt.txt
          if-no-files-found: error
          retention-days: 14

      - name: Prepare TestFlight upload intent
        if: inputs.mode == 'submit'
        run: |
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" \
            --phase eas_upload --status unknown --intent "$RUNNER_TEMP/hither-ios-cd-intent-eas_upload.json"

      - name: Upload TestFlight mutation intent
        id: submit_intent_upload
        if: inputs.mode == 'submit'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hither-ios-cd-intent-${{ github.run_id }}-${{ github.run_attempt }}-eas_upload
          path: ${{ runner.temp }}/hither-ios-cd-intent-eas_upload.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload this IPA to TestFlight
        if: inputs.mode == 'submit'
        env:
          EXPO_TOKEN: ${{ secrets.HITHER_GITHUB_ACTIONS }}
          INTENT_RETAINED: ${{ steps.submit_intent_upload.outcome }}
        run: |
          [[ "$INTENT_RETAINED" == success ]] || { echo 'TestFlight upload intent retention is required'; exit 1; }
          npx --yes eas-cli@21.0.2 submit --platform ios --profile production \
            --path "$RUNNER_TEMP/Hither-production.ipa" --non-interactive --wait
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase eas_upload --status passed
          python3 ../../scripts/write-ios-cd-outcome.py --journal "$RUNNER_TEMP/hither-ios-cd-journal.jsonl" --phase apple_processing --status unknown
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          event = json.loads((root / 'hither-ios-cd-journal.jsonl').read_text().splitlines()[-1])
          receipt = {key: event[key] for key in ('sourceSha', 'runId', 'runAttempt', 'mode')}
          receipt.update(easUpload='reported_complete', appleProcessing='unknown', deviceAcceptance='not_verified')
          (root / 'hither-ios-upload-receipt.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          PY
          cat "$RUNNER_TEMP/hither-ios-upload-receipt.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TestFlight submission receipt
        if: always() && inputs.mode == 'submit'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hither-ios-upload-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hither-ios-upload-receipt.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Finalize iOS attempt outcome
        if: always()
        working-directory: .
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_TRUSTED: ${{ steps.trusted_source.outcome }}
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, re, tempfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          journal = root / 'hither-ios-cd-journal.jsonl'
          outcome = root / 'hither-ios-cd-outcome.json'
          source = os.environ.get('SOURCE_SHA', '')
          source = source if re.fullmatch(r'[0-9a-f]{40}', source) else None
          mode = os.environ.get('RELEASE_MODE', '')
          mode = mode if mode in {'inspect-release', 'preflight', 'validate-release', 'ota', 'build-only', 'submit'} else None
          helper = Path('scripts/write-ios-cd-outcome.py')
          if os.environ.get('SOURCE_TRUSTED') == 'success' and helper.is_file() and source is not None and mode is not None:
              spec = importlib.util.spec_from_file_location('cd_outcome', helper)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              module.finalize(journal, module.attempt_identity(os.environ), os.environ['JOB_STATUS'], outcome)
          else:
              run_id, attempt = os.environ.get('GITHUB_RUN_ID', ''), os.environ.get('GITHUB_RUN_ATTEMPT', '')
              if not re.fullmatch(r'[1-9][0-9]*', run_id) or not re.fullmatch(r'[1-9][0-9]*', attempt):
                  raise ValueError('invalid GitHub attempt identity')
              event = {'sourceSha': source, 'runId': run_id, 'runAttempt': int(attempt), 'mode': mode,
                       'phase': 'dispatch', 'status': 'unknown' if os.environ['JOB_STATUS'] == 'cancelled' else 'failed'}
              for path in (journal, outcome):
                  with tempfile.NamedTemporaryFile(mode='w', dir=root, delete=False) as stream:
                      json.dump(event, stream, sort_keys=True)
                      stream.write('\n')
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.replace(stream.name, path)
          PY
          cat "$RUNNER_TEMP/hither-ios-cd-outcome.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS attempt outcome
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hither-ios-cd-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hither-ios-cd-journal.jsonl
            ${{ runner.temp }}/hither-ios-cd-outcome.json
          if-no-files-found: error
          retention-days: 14
