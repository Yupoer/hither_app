name: Supabase production deploy

# Manual production backend deployment. `verify` is read-only: it lists migration
# history. `apply` executes only the listed migration versions, in ascending order,
# marks each applied after it succeeds, may deploy Edge Functions, then re-checks
# history. It never runs `db push`: production history has remote-only versions, so
# a push would replay unrelated migrations. `apply` only runs from master.
# Required repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: verify is read-only. apply executes the listed versions against production.
        required: true
        default: verify
        type: choice
        options:
          - verify
          - apply
      versions:
        description: Space-separated 14-digit migration versions to execute during apply.
        required: false
        default: ""
        type: string
      mark_applied:
        description: Space-separated versions whose SQL already ran; only record them as applied.
        required: false
        default: ""
        type: string
      functions:
        description: Space-separated Edge Functions to deploy during apply. Leave empty to skip.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

env:
  SUPABASE_CLI: supabase@3.3.0
  PROJECT_REF: htqrucnjafhhvxdqslbv

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MODE: ${{ inputs.mode }}
      VERSIONS: ${{ inputs.versions }}
      MARK_APPLIED: ${{ inputs.mark_applied }}
      FUNCTIONS: ${{ inputs.functions }}
    steps:
      - name: Require master and versions for apply
        if: inputs.mode == 'apply'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::apply runs only from master"
            exit 1
          fi
          if [ -z "$VERSIONS" ] && [ -z "$FUNCTIONS" ] && [ -z "$MARK_APPLIED" ]; then
            echo "::error::apply needs versions, mark_applied or functions"
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Require credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is not set"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::SUPABASE_DB_PASSWORD is not set"; exit 1; }
      - name: Migration history before
        run: npx --yes "$SUPABASE_CLI" migration list --remote="$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD" | tee "$RUNNER_TEMP/before.txt"
      - name: Record already-executed versions
        if: inputs.mode == 'apply' && inputs.mark_applied != ''
        run: |
          set -euo pipefail
          for v in $(printf '%s\n' $MARK_APPLIED | sort -u); do
            [[ "$v" =~ ^[0-9]{14}$ ]] || { echo "::error::invalid version $v"; exit 1; }
            ls supabase/migrations/${v}_*.sql >/dev/null 2>&1 || { echo "::error::no migration file for $v"; exit 1; }
            npx --yes "$SUPABASE_CLI" migration repair --remote="$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD" --yes --status applied "$v"
          done
      - name: Execute listed migrations
        if: inputs.mode == 'apply' && inputs.versions != ''
        run: |
          set -euo pipefail
          for v in $(printf '%s\n' $VERSIONS | sort -u); do
            [[ "$v" =~ ^[0-9]{14}$ ]] || { echo "::error::invalid version $v"; exit 1; }
            file=$(ls supabase/migrations/${v}_*.sql 2>/dev/null | head -1)
            [ -n "$file" ] || { echo "::error::no migration file for $v"; exit 1; }
            if grep -qE "\`$v\` +\| +\`$v\`" "$RUNNER_TEMP/before.txt"; then
              echo "::error::$v is already applied on production"
              exit 1
            fi
            echo "Executing $file"
            npx --yes "$SUPABASE_CLI" db query --remote="$PROJECT_REF" --yes -f "$file"
            npx --yes "$SUPABASE_CLI" migration repair --remote="$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD" --yes --status applied "$v"
          done
      - name: Deploy Edge Functions
        if: inputs.mode == 'apply' && inputs.functions != ''
        run: |
          # shellcheck disable=SC2086
          npx --yes "$SUPABASE_CLI" functions deploy --remote="$PROJECT_REF" --use-api --yes $FUNCTIONS
      - name: Verify listed versions are applied
        if: inputs.mode == 'apply' && (inputs.versions != '' || inputs.mark_applied != '')
        run: |
          npx --yes "$SUPABASE_CLI" migration list --remote="$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD" | tee "$RUNNER_TEMP/after.txt"
          for v in $VERSIONS $MARK_APPLIED; do
            grep -qE "\`$v\` +\| +\`$v\`" "$RUNNER_TEMP/after.txt" || { echo "::error::$v is not recorded as applied"; exit 1; }
          done
      - name: Summary
        if: always()
        run: |
          {
            echo "### Supabase production ($MODE)"
            echo '```'
            grep -E '`2026111[0-9]' "$RUNNER_TEMP/before.txt" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
