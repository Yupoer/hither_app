name: CI

# Hither CI — gates required before store/TestFlight release:
#   1. Logic and component regressions       -> jest + jest-expo
#   2. Test meta (acceptance map L1 + anti-fake L2)
#   3. Changed-function coverage ≥85%        -> test:ci
#   4. TypeScript regressions                -> tsc --noEmit
#   5. iOS runtime / OTA alignment           -> verify:runtime
#   6. Expo dependency version drift         -> expo install --check
#   7. Expo doctor                           -> expo-doctor (blocking)
#   8. All SQL regressions + promo race      -> supabase test db (pgTAP)
#
# Store/TestFlight release must pass runtime alignment so incompatible native
# binaries cannot load an OTA built for a different engine/RN/Hermes set.
# EAS Build/Submit remains a separate release step (not auto-triggered here).
#
# On failure on the default branch, the `open-issue` job files a deduped GitHub issue
# labelled `ci-failure` + `claude-fix` for triage. A maintainer can dispatch the
# Claude Fix workflow after reviewing the report; issue events do not run an agent.

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Collect optional paired optimization evidence in addition to full CI.
        type: boolean
        default: false
      benchmark_kind:
        description: Select the independent experiment.
        type: choice
        options: [all, workers, cache]
        default: all
      benchmark_coverage_base:
        description: Real 40-character commit SHA for the worker coverage benchmark base.
        type: string
        default: 017bf952db09c353ae7b14984d941be8c584fa30

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      product: ${{ steps.scope.outputs.product }}
      mode: ${{ steps.scope.outputs.mode }}
      groups: ${{ steps.scope.outputs.groups }}
      expected_jobs: ${{ steps.scope.outputs.expected_jobs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Verify workflow tooling
        working-directory: ${{ github.workspace }}
        run: |
          python3 scripts/test_workflow_scope.py
          python3 scripts/test_ci_required.py
          python3 -B scripts/test_ci_trigger_matrix.py
          python3 -B scripts/test_ios_ota_compatibility.py
          python3 -B scripts/test_ios_ota_publication.py
          python3 -B scripts/test_ios_cd_routing.py
          python3 -B scripts/test_ios_cd_outcome.py
          python3 -B scripts/test_ios_cd_attempt.py
          python3 -B scripts/test_ios_release_inventory.py
          python3 -B scripts/test_ios_release_launch_gate.py
          node scripts/test-ci-meta.mjs
          node --test apps/mobile/scripts/check-changed-coverage.test.mjs apps/mobile/scripts/check-ci-evidence.test.mjs apps/mobile/scripts/check-quick.test.mjs apps/mobile/scripts/benchmark-ci.test.mjs apps/mobile/scripts/benchmark-install.test.mjs scripts/ci-shadow-plan.test.mjs scripts/mobile-install-key.test.mjs scripts/check-release-ci.test.mjs
          bash -n scripts/install-git-hooks.sh scripts/ota-auto-ship.sh scripts/task-end-ship.sh scripts/install-mobile-dependencies.sh

      - name: Classify rules and documentation changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ startsWith(github.ref, 'refs/heads/deliver/') && 'origin/master' || github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check-workflow-scope.py
        working-directory: ${{ github.workspace }}

  verify:
    needs: scope
    if: fromJSON(needs.scope.outputs.expected_jobs)['verify']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-mobile

      - name: Set up Java for location sync verification
        if: contains(fromJSON(needs.scope.outputs.groups), 'location-sync-formal')
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download pinned TLA tools
        if: contains(fromJSON(needs.scope.outputs.groups), 'location-sync-formal')
        run: curl --fail --location --output "$RUNNER_TEMP/tla2tools-v1.7.4.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar

      - name: Verify location sync model and real source replay
        if: contains(fromJSON(needs.scope.outputs.groups), 'location-sync-formal')
        working-directory: ${{ github.workspace }}
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla2tools-v1.7.4.jar
        run: node .cursor/skills/verify-location-sync-formally/scripts/check.cjs

      - name: Upload location sync formal evidence
        if: always() && contains(fromJSON(needs.scope.outputs.groups), 'location-sync-formal')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hither-location-sync-formal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cursor/skills/verify-location-sync-formally/.tmp/summary.json
            .cursor/skills/verify-location-sync-formally/.tmp/*/tlc.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Resolve META_PARENT
        id: test_meta
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const marker = /<!--\s*hither-test-meta\s+parent:\s*([A-Za-z0-9_-]+)\s*-->/i;
            const ref = context.ref || '';
            if (ref === 'refs/heads/master' || ref === 'refs/heads/main' ||
                (context.eventName === 'workflow_dispatch' && ref.startsWith('refs/heads/deliver/'))) {
              core.setOutput('parent', '');
              core.info('master or manual direct delivery: META_PARENT unset (validate whole map)');
              return;
            }
            let body = '';
            if (context.eventName === 'pull_request') {
              // The event body predates metadata added after the PR was opened.
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              });
              body = pr.data.body || '';
            } else {
              const branch = ref.replace(/^refs\/heads\//, '');
              const prs = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                state: 'open',
                per_page: 5,
              });
              if (prs.data.length === 0) {
                core.setFailed(
                  `No open PR for branch ${branch}. Open a PR and add <!-- hither-test-meta parent: <issue>|pure-chore --> to the body.`,
                );
                return;
              }
              body = prs.data[0].body || '';
            }
            const m = body.match(marker);
            if (!m) {
              core.setFailed(
                'Missing durable PR meta marker in PR body: <!-- hither-test-meta parent: <issue-number>|pure-chore -->',
              );
              return;
            }
            core.setOutput('parent', m[1]);
            core.info(`Resolved META_PARENT=${m[1]}`);

      - name: Test meta (L1 map + L2 anti-fake)
        run: bun run test:meta
        env:
          META_PARENT: ${{ steps.test_meta.outputs.parent }}

      - name: Node tests and changed functions ≥85%
        run: |
          node test/headless/scenario-coverage.test.cjs
          bun run test:ci
          node test/headless/scenario-coverage.cjs test-artifacts/node-jest.raw.json test-artifacts/headless-scenarios.md > test-artifacts/headless-scenarios.raw.json
          node scripts/check-ci-evidence.mjs
        env:
          COVERAGE_BASE: ${{ startsWith(github.ref, 'refs/heads/deliver/') && 'origin/master' || github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          COVERAGE_THRESHOLD: '85'

      - name: Upload safe node evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hither-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/mobile/test-artifacts/ci-shadow-plan.json
            apps/mobile/test-artifacts/node-receipt.json
            apps/mobile/test-artifacts/headless-scenarios.json
            apps/mobile/test-artifacts/headless-scenarios.md
            apps/mobile/coverage-changed/coverage-summary.json
          if-no-files-found: error
          retention-days: 14

  mobile-checks:
    needs: scope
    if: fromJSON(needs.scope.outputs.expected_jobs)['mobile-checks']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-mobile

      - name: Component tests (jest-expo)
        run: bun run test --config jest.config.components.js --runInBand --silent
        env:
          NODE_OPTIONS: --experimental-vm-modules

      - name: Lint (eslint — full tree; featureTour at error severity)
        run: bun run lint

      - name: Typecheck (tsc)
        run: bun run typecheck

      - name: Verify iOS runtime alignment
        run: bun run verify:runtime

      - name: Expo dependency check (version drift = Expo Go crashes)
        run: bunx --no-install expo install --check

      - name: Expo doctor
        # SDK 57 includes the Hermes fix; keep the current advisory check enabled.
        run: bunx expo-doctor@1.20.4

      - name: HTTPS recovery browser behavior
        working-directory: ${{ github.workspace }}
        run: node scripts/auth-web-recovery-check.mjs

  backend:
    needs: scope
    if: fromJSON(needs.scope.outputs.expected_jobs)['backend']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: SQL function source of truth (replayed catalog patches, no new ones)
        working-directory: ${{ github.workspace }}
        run: |
          node --test supabase/scripts/function-source-of-truth.test.mjs
          node supabase/scripts/function-source-of-truth.mjs --check

      - name: Deno Edge fixture tests
        working-directory: ${{ github.workspace }}
        run: |
          deno test --allow-env --allow-net --allow-read --allow-import \
            supabase/functions/_shared/storekit_test.ts \
            supabase/functions/_shared/storekit_certificate_test.ts \
            supabase/functions/send-push/ \
            supabase/functions/verify-and-apply-purchase/index_test.ts \
            supabase/functions/apple-server-notifications/index_test.ts \
            supabase/functions/sync-app-store-subscription/index_test.ts \
            supabase/functions/google-maps/index_test.ts \
            supabase/functions/admob-reward-callback/ssv_test.ts

      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: 2.109.1

      - name: Strip migration BOM for local supabase CLI
        working-directory: ${{ github.workspace }}
        run: node supabase/scripts/strip-migration-bom.mjs

      - name: Scheduled navigation pre-migration upgrade regression
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "$RUNNER_TEMP/hither-scheduled-upgrade"
          bun install --cwd "$RUNNER_TEMP/hither-scheduled-upgrade" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          node supabase/tests/run-security-local.mjs \
            "$RUNNER_TEMP/hither-scheduled-upgrade/node_modules/@electric-sql/pglite/dist/index.js" \
            --before-migration=20261102152223_scheduled_navigation_start.sql:../verification-probes/scheduled_navigation_upgrade.seed.sql \
            ../verification-probes/scheduled_navigation_upgrade.sql

      - name: All Supabase SQL regressions (pgTAP)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          supabase db start
          mapfile -d '' tests < <(find supabase/tests -type f -name '*.test.sql' -print0 | sort -z)
          test "${#tests[@]}" -gt 0
          supabase test db --local "${tests[@]}"
          node supabase/tests/promo_redemption_concurrency.mjs
          node supabase/tests/trip_storekit_refund_concurrency.mjs

  jsi-ui-runtime:
    needs: scope
    if: fromJSON(needs.scope.outputs.expected_jobs)['jsi-ui-runtime']
    # Swift's isIsolatingCurrentContext runtime hook requires macOS 26 or later.
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-mobile
      - name: Verify native host environment
        run: |
          xcodebuild -version | grep -E '^Xcode 27\.0(\.[0-9]+)?$'
          sw_vers
          uname -m | grep -Fx arm64
          xcrun swiftc --version
          xcrun --sdk macosx --show-sdk-version
          python3 -c 'import platform; assert int(platform.mac_ver()[0].split(".")[0]) >= 26'
      - name: Exercise native foreground and headless snapshot races
        run: |
          swiftc -swift-version 5 modules/hither-live-activity/ios/HitherLiveActivitySnapshot.swift src/__tests__/native/HitherLiveActivitySnapshotTests.swift -o "$RUNNER_TEMP/hither-live-activity-snapshot-tests"
          "$RUNNER_TEMP/hither-live-activity-snapshot-tests"
      - name: Exercise optimized UI and JavaScript actor contexts
        run: |
          python3 scripts/build-jsi-executor-probe.py "$RUNNER_TEMP/hither-jsi-probe" --host --release
          "$RUNNER_TEMP/hither-jsi-probe" ui many
          if "$RUNNER_TEMP/hither-jsi-probe" wrong > "$RUNNER_TEMP/hither-jsi-wrong.log" 2>&1; then
            echo "Unexpected acceptance of an arbitrary background thread"
            exit 1
          fi
          grep -E 'data race detected|JavaScriptActor operations must be run' "$RUNNER_TEMP/hither-jsi-wrong.log"

  jsi-ios27-runtime:
    needs: scope
    if: fromJSON(needs.scope.outputs.expected_jobs)['jsi-ios27-runtime']
    runs-on: xcode-27
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-mobile
      - name: Verify Release debugger capture and cleanup
        working-directory: ${{ github.workspace }}
        timeout-minutes: 3
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
        run: |
          probe_status=0
          python3 -B -c 'import json; from pathlib import Path; print(json.dumps({"releaseXcodeBundlePresent": Path("/Applications/Xcode_27.0.app/Contents/Developer").is_dir()}))'
          xcodebuild -version > "$RUNNER_TEMP/hither-debugger-xcode-version.txt" || probe_status=$?
          cat "$RUNNER_TEMP/hither-debugger-xcode-version.txt"
          grep -Eq '^Xcode 27\.0(\.[0-9]+)?$' "$RUNNER_TEMP/hither-debugger-xcode-version.txt" || probe_status=1
          python3 -B apps/mobile/scripts/ios_launch_debugger.py check --output "$RUNNER_TEMP/hither-release-debugger-ci" --print-result || probe_status=$?
          python3 -B scripts/test_ios_launch_debugger.py NativeCleanupTests.test_real_darwin_zombie_group_is_reaped_before_signaling || probe_status=1
          exit "$probe_status"
      - name: Select iPhone 12 Pro on iOS 27 for the native probe
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          runtimes = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '--json']))['runtimes']
          runtime = next(r for r in runtimes if r.get('isAvailable') and r['version'].split('.')[0] == '27' and r['identifier'].endswith('iOS-27-0'))
          print('Testing', runtime['name'], runtime['version'], runtime['buildversion'], flush=True)
          device = subprocess.check_output(['xcrun', 'simctl', 'create', 'Hither-JSI-iOS27', 'com.apple.CoreSimulator.SimDeviceType.iPhone-12-Pro', runtime['identifier']], text=True).strip()
          # This Foundation/Swift actor probe does not use OS services. Standalone
          # execution keeps first-boot system migration out of this native gate.
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write('JSI_SIMULATOR=' + device + '\n')
              handle.write('JSI_RUNTIME_BUILD=' + runtime['buildversion'] + '\n')
          PY
      - name: Verify iOS 27 UI regression and background-thread rejection
        run: python3 scripts/verify-jsi-simulator.py --simulator "$JSI_SIMULATOR" --output "$RUNNER_TEMP/hither-jsi-ios27" --standalone --runtime-build "$JSI_RUNTIME_BUILD"

  benchmark-workers:
    needs: scope
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark && inputs.benchmark_kind != 'cache'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, coverage]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-mobile
      - name: Five same-runner worker pairs
        working-directory: apps/mobile
        env:
          BENCHMARK_MODE: ${{ matrix.mode }}
          BENCHMARK_COVERAGE_BASE: ${{ inputs.benchmark_coverage_base }}
        run: |
          base=$(git rev-parse HEAD)
          if [ "$BENCHMARK_MODE" = coverage ]; then base="$BENCHMARK_COVERAGE_BASE"; fi
          node scripts/benchmark-ci.mjs --mode "$BENCHMARK_MODE" --base "$base" --candidate-workers 2
      - name: Upload sanitized worker comparison
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-workers-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/mobile/test-artifacts/benchmark-${{ matrix.mode }}/comparison.json
          if-no-files-found: error
          retention-days: 14

  benchmark-cache:
    needs: scope
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark && inputs.benchmark_kind != 'workers'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-26, xcode-27]
        pair: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Start priming timer
        shell: bash
        run: node apps/mobile/scripts/benchmark-install.mjs start --output "$RUNNER_TEMP/prime-start.json"
      - uses: ./.github/actions/setup-mobile
        id: seed
      - name: Start save timer
        shell: bash
        run: node apps/mobile/scripts/benchmark-install.mjs start --output "$RUNNER_TEMP/save-start.json"
      - name: Seed this sample's exact installed cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/mobile/node_modules
          key: ${{ steps.seed.outputs.exact-key }}-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}-${{ matrix.pair }}
      - name: Record separate priming and save overhead
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const now = process.hrtime.bigint();
          const read = name => BigInt(JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, name))).startNs);
          fs.mkdirSync('test-artifacts/benchmark-cache', { recursive: true });
          fs.writeFileSync('test-artifacts/benchmark-cache/overhead.json', JSON.stringify({
            primeInstallMs: Number(read('save-start.json') - read('prime-start.json')) / 1e6,
            saveMs: Number(now - read('save-start.json')) / 1e6,
            imageOS: process.env.ImageOS, imageVersion: process.env.ImageVersion,
          }, null, 2) + '\n');
          NODE
      - name: Reset and time baseline first
        if: contains(fromJSON('[1,3,5]'), matrix.pair)
        shell: bash
        run: |
          rm -rf apps/mobile/node_modules
          node apps/mobile/scripts/benchmark-install.mjs start --output "$RUNNER_TEMP/start-baseline.json"
      - name: Clean Bun install first
        if: contains(fromJSON('[1,3,5]'), matrix.pair)
        working-directory: apps/mobile
        shell: bash
        run: bash ../../scripts/install-mobile-dependencies.sh
      - name: Validate baseline first
        if: contains(fromJSON('[1,3,5]'), matrix.pair)
        shell: bash
        run: node apps/mobile/scripts/benchmark-install.mjs finish --start "$RUNNER_TEMP/start-baseline.json" --output "$RUNNER_TEMP/baseline.json" --arm baseline --pair "${{ matrix.pair }}" --key "${{ steps.seed.outputs.exact-key }}-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}-${{ matrix.pair }}" --cache-hit "false"
      - name: Reset and time candidate first
        if: contains(fromJSON('[2,4]'), matrix.pair)
        shell: bash
        run: |
          rm -rf apps/mobile/node_modules
          node apps/mobile/scripts/benchmark-install.mjs start --output "$RUNNER_TEMP/start-candidate.json"
      - name: Restore actual installed cache first
        if: contains(fromJSON('[2,4]'), matrix.pair)
        id: restore-first
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/mobile/node_modules
          key: ${{ steps.seed.outputs.exact-key }}-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}-${{ matrix.pair }}
          fail-on-cache-miss: true
      - name: Validate candidate first
        if: contains(fromJSON('[2,4]'), matrix.pair)
        shell: bash
        run: node apps/mobile/scripts/benchmark-install.mjs finish --start "$RUNNER_TEMP/start-candidate.json" --output "$RUNNER_TEMP/candidate.json" --arm candidate --pair "${{ matrix.pair }}" --key "${{ steps.seed.outputs.exact-key }}-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}-${{ matrix.pair }}" --cache-hit "${{ steps.restore-first.outputs.cache-hit == 'true' }}"
      - name: Reset and time candidate second
        if: contains(fromJSON('[1,3,5]'), matrix.pair)
        shell: bash
        run: |
          rm -rf apps/mobile/node_modules
          node apps/mobile/scripts/benchmark-install.mjs start --output "$RUNNER_TEMP/start-candidate.json"
      - name: Restore actual installed cache second
        if: contains(fromJSON('[1,3,5]'), matrix.pair)
        id: restore-second
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/mobile/node_modules
          key: ${{ steps.seed.outputs.exact-key }}-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}-${{ matrix.pair }}
          fail-on-cache-miss: true
      - name: Validate candidate second
        if: contains(fromJSON('[1,3,5]'), matrix.pair)
        shell: bash
        run: node apps/mobile/scripts/benchmark-install.mjs finish --start "$RUNNER_TEMP/start-candidate.json" --output "$RUNNER_TEMP/candidate.json" --arm candidate --pair "${{ matrix.pair }}" --key "${{ steps.seed.outputs.exact-key }}-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}-${{ matrix.pair }}" --cache-hit "${{ steps.restore-second.outputs.cache-hit == 'true' }}"
      - name: Reset and time baseline second
        if: contains(fromJSON('[2,4]'), matrix.pair)
        shell: bash
        run: |
          rm -rf apps/mobile/node_modules
          node apps/mobile/scripts/benchmark-install.mjs start --output "$RUNNER_TEMP/start-baseline.json"
      - name: Clean Bun install second
        if: contains(fromJSON('[2,4]'), matrix.pair)
        working-directory: apps/mobile
        shell: bash
        run: bash ../../scripts/install-mobile-dependencies.sh
      - name: Validate baseline second
        if: contains(fromJSON('[2,4]'), matrix.pair)
        shell: bash
        run: node apps/mobile/scripts/benchmark-install.mjs finish --start "$RUNNER_TEMP/start-baseline.json" --output "$RUNNER_TEMP/baseline.json" --arm baseline --pair "${{ matrix.pair }}" --key "${{ steps.seed.outputs.exact-key }}-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}-${{ matrix.pair }}" --cache-hit "false"
      - name: Compare paired dependency and runtime evidence
        shell: bash
        run: node apps/mobile/scripts/benchmark-install.mjs compare --baseline "$RUNNER_TEMP/baseline.json" --candidate "$RUNNER_TEMP/candidate.json" --output test-artifacts/benchmark-cache/pair.json
      - name: Upload sanitized cache pair
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-cache-${{ matrix.runner }}-pair-${{ matrix.pair }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-artifacts/benchmark-cache/pair.json
            test-artifacts/benchmark-cache/overhead.json
          if-no-files-found: error
          retention-days: 14

  ci-required:
    needs: [scope, verify, mobile-checks, backend, jsi-ui-runtime, jsi-ios27-runtime]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Require every applicable gate
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-required.py

  # Turn a red build on the default branch into an actionable, deduped issue.
  open-issue:
    timeout-minutes: 5
    needs: [ci-required]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `CI failed on master @ ${sha}`;
            const body = [
              `CI failed on \`master\` at commit ${context.sha}.`,
              ``,
              `**Run:** ${runUrl}`,
              ``,
              `@claude The CI pipeline (\`.github/workflows/ci.yml\`) is red. Open the run above,`,
              `read the failing step's logs, reproduce the failure using the checked-in workflow, and make the smallest correct fix.`,
              `Export the starting commit SHA as COVERAGE_BASE before editing. Run affected quick checks with bun run check:quick -- --base "$COVERAGE_BASE" from apps/mobile.`,
              `Commit the candidate locally before bun run test:ci because changed-source coverage compares COVERAGE_BASE...HEAD. Use test:ci once for the full Node gate.`,
              `Keep test:meta, typecheck, and the owning component, lint, runtime, Expo, formal, SQL, and native gates green as selected by this workflow.`,
              `Close with the root cause, failure evidence, verification, and an evidence-based prevention choice. The existing check may be sufficient, need repair, or lack one distinct check or constraint. No new check is also valid when justified.`,
            ].join("\n");
            // Dedupe: skip if an open ci-failure issue already exists for this sha.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "ci-failure", per_page: 50,
            });
            if (existing.data.some(i => i.title === title)) {
              core.info("Issue already open for this sha; skipping.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ["ci-failure", "claude-fix"],
            });
