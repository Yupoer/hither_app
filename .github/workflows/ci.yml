name: CI

# Hither CI — gates required before store/TestFlight release:
#   1. Logic regressions                     -> jest (incl. nativeModuleVersions guard)
#   2. Test meta (acceptance map L1 + anti-fake L2)
#   3. Changed-function coverage ≥85%        -> test:coverage:changed
#   4. TypeScript regressions                -> tsc --noEmit
#   5. iOS runtime / OTA alignment           -> verify:runtime
#   6. Expo dependency version drift         -> expo install --check
#   7. Expo doctor                           -> expo-doctor (blocking)
#   8. Kick RPC authorization matrix         -> supabase test db (pgTAP)
#
# Store/TestFlight release must pass runtime alignment so incompatible native
# binaries cannot load an OTA built for a different engine/RN/Hermes set.
# EAS Build/Submit remains a separate release step (not auto-triggered here).
#
# On failure on the default branch, the `open-issue` job files a deduped GitHub issue
# labelled `ci-failure` + `claude-fix`, which the claude-fix workflow picks up to open a
# fix PR automatically.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Test (jest)
        run: npm test --silent

      - name: Test meta (L1 map + L2 anti-fake)
        run: npm run test:meta

      - name: Coverage changed functions ≥85%
        run: npm run test:coverage:changed
        env:
          COVERAGE_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || 'origin/master' }}
          COVERAGE_THRESHOLD: '85'

      - name: Lint (eslint — full tree; featureTour at error severity)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Verify iOS runtime alignment
        run: npm run verify:runtime

      - name: Expo dependency check (version drift = Expo Go crashes)
        run: npx --yes expo install --check

      - name: Expo doctor
        run: npx --yes expo-doctor

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Strip migration BOM for local supabase CLI
        working-directory: ${{ github.workspace }}
        run: node supabase/scripts/strip-migration-bom.mjs

      - name: Supabase SQL kick authorization (pgTAP)
        working-directory: ${{ github.workspace }}
        run: |
          supabase db start
          supabase test db --local supabase/tests/kick_group_member.test.sql

  # Turn a red build on the default branch into an actionable, deduped issue.
  open-issue:
    needs: verify
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `CI failed on master @ ${sha}`;
            const body = [
              `CI failed on \`master\` at commit ${context.sha}.`,
              ``,
              `**Run:** ${runUrl}`,
              ``,
              `@claude The CI pipeline (\`.github/workflows/ci.yml\`) is red. Open the run above,`,
              `read the failing step's logs, find the root cause, and open a PR that fixes it.`,
              `Gates are: jest, test:meta, test:coverage:changed, lint, tsc --noEmit, verify:runtime, expo install --check, expo-doctor, supabase test db (pgTAP). Keep the fix minimal.`,
            ].join("\n");
            // Dedupe: skip if an open ci-failure issue already exists for this sha.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "ci-failure", per_page: 50,
            });
            if (existing.data.some(i => i.title === title)) {
              core.info("Issue already open for this sha; skipping.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ["ci-failure", "claude-fix"],
            });
