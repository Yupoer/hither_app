name: CI

# Hither CI — gates required before store/TestFlight release:
#   1. Logic regressions                     -> jest (incl. nativeModuleVersions guard)
#   2. Test meta (acceptance map L1 + anti-fake L2)
#   3. Changed-function coverage ≥85%        -> test:coverage:changed
#   4. TypeScript regressions                -> tsc --noEmit
#   5. iOS runtime / OTA alignment           -> verify:runtime
#   6. Expo dependency version drift         -> expo install --check
#   7. Expo doctor                           -> expo-doctor (blocking)
#   8. Kick RPC authorization matrix         -> supabase test db (pgTAP)
#
# Store/TestFlight release must pass runtime alignment so incompatible native
# binaries cannot load an OTA built for a different engine/RN/Hermes set.
# EAS Build/Submit remains a separate release step (not auto-triggered here).
#
# On failure on the default branch, the `open-issue` job files a deduped GitHub issue
# labelled `ci-failure` + `claude-fix` for triage. A maintainer can dispatch the
# Claude Fix workflow after reviewing the report; issue events do not run an agent.

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.scope.outputs.product }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify workflow tooling
        working-directory: ${{ github.workspace }}
        run: |
          python3 scripts/test_workflow_scope.py
          bash -n scripts/install-git-hooks.sh scripts/ota-auto-ship.sh scripts/task-end-ship.sh

      - name: Classify rules and documentation changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check-workflow-scope.py
        working-directory: ${{ github.workspace }}

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.product == 'true'
        with:
          # Real SQLite transaction tests use node:sqlite (also verified locally on 22.17.1).
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install
        if: steps.scope.outputs.product == 'true'
        run: npm ci

      - name: Test (jest)
        if: steps.scope.outputs.product == 'true'
        run: npm test --silent

      # Durable PR marker (not github.base_ref): <!-- hither-test-meta parent: N|pure-chore -->
      - name: Resolve META_PARENT from PR metadata
        if: steps.scope.outputs.product == 'true'
        id: test_meta
        uses: actions/github-script@v7
        with:
          script: |
            const marker = /<!--\s*hither-test-meta\s+parent:\s*([A-Za-z0-9_-]+)\s*-->/i;
            const ref = context.ref || '';
            if (ref === 'refs/heads/master' || ref === 'refs/heads/main') {
              core.setOutput('parent', '');
              core.info('default-branch push: META_PARENT unset (validate whole map)');
              return;
            }
            let body = '';
            if (context.eventName === 'pull_request') {
              body = context.payload.pull_request?.body || '';
            } else {
              const branch = ref.replace(/^refs\/heads\//, '');
              const prs = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                state: 'open',
                per_page: 5,
              });
              if (prs.data.length === 0) {
                core.setFailed(
                  `No open PR for branch ${branch}. Open a PR and add <!-- hither-test-meta parent: <issue>|pure-chore --> to the body.`,
                );
                return;
              }
              body = prs.data[0].body || '';
            }
            const m = body.match(marker);
            if (!m) {
              core.setFailed(
                'Missing durable PR meta marker in PR body: <!-- hither-test-meta parent: <issue-number>|pure-chore -->',
              );
              return;
            }
            core.setOutput('parent', m[1]);
            core.info(`Resolved META_PARENT=${m[1]}`);

      - name: Test meta (L1 map + L2 anti-fake)
        if: steps.scope.outputs.product == 'true'
        run: npm run test:meta
        env:
          META_PARENT: ${{ steps.test_meta.outputs.parent }}

      - name: Coverage changed functions ≥85%
        if: steps.scope.outputs.product == 'true'
        run: npm run test:coverage:changed
        env:
          COVERAGE_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || 'origin/master' }}
          COVERAGE_THRESHOLD: '85'

      - name: Lint (eslint — full tree; featureTour at error severity)
        if: steps.scope.outputs.product == 'true'
        run: npm run lint

      - name: Typecheck (tsc)
        if: steps.scope.outputs.product == 'true'
        run: npm run typecheck

      - name: Verify iOS runtime alignment
        if: steps.scope.outputs.product == 'true'
        run: npm run verify:runtime

      - name: Expo dependency check (version drift = Expo Go crashes)
        if: steps.scope.outputs.product == 'true'
        run: npx --yes expo install --check

      - name: Expo doctor
        if: steps.scope.outputs.product == 'true'
        # SDK 57 includes the Hermes fix; keep the current advisory check enabled.
        run: npx --yes expo-doctor@1.20.4

      - name: HTTPS recovery browser behavior
        if: steps.scope.outputs.product == 'true'
        working-directory: ${{ github.workspace }}
        run: node scripts/auth-web-recovery-check.mjs

      - uses: denoland/setup-deno@v2
        if: steps.scope.outputs.product == 'true'
        with:
          deno-version: v2.x

      - name: Deno Edge fixture tests
        if: steps.scope.outputs.product == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          deno test --no-check --allow-env --allow-net --allow-read --allow-import \
            supabase/functions/_shared/storekit_test.ts \
            supabase/functions/_shared/storekit_certificate_test.ts \
            supabase/functions/send-push/auth_test.ts \
            supabase/functions/verify-and-apply-purchase/index_test.ts \
            supabase/functions/apple-server-notifications/index_test.ts \
            supabase/functions/sync-app-store-subscription/index_test.ts \
            supabase/functions/admob-reward-callback/ssv_test.ts

      - uses: supabase/setup-cli@v1
        if: steps.scope.outputs.product == 'true'
        with:
          version: 2.109.1

      - name: Strip migration BOM for local supabase CLI
        if: steps.scope.outputs.product == 'true'
        working-directory: ${{ github.workspace }}
        run: node supabase/scripts/strip-migration-bom.mjs

      - name: Supabase SQL kick authorization (pgTAP)
        if: steps.scope.outputs.product == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          supabase db start
          supabase test db --local supabase/tests/kick_group_member.test.sql
          supabase test db --local supabase/tests/delete_account.test.sql
          supabase test db --local supabase/tests/storekit_purchase_ledger.test.sql
          supabase test db --local supabase/tests/premium_projection.test.sql
          supabase test db --local supabase/tests/premium_anonymous_cleanup_skip.test.sql
          supabase test db --local supabase/tests/database_security_role_matrix.test.sql
          supabase test db --local supabase/tests/anonymous_expiry_is_member.test.sql
          supabase test db --local supabase/tests/core_operation_gathering_validation.test.sql
          supabase test db --local supabase/tests/core_operation_outbox_durable.test.sql
          supabase test db --local supabase/tests/quick_add_first_stop.test.sql
          supabase test db --local supabase/tests/durable_trip_daily_accommodation.test.sql
          supabase test db --local supabase/tests/durable_solo_refresh_receipts.test.sql
          supabase test db --local supabase/tests/reconcile_replaced_stay_cards.test.sql
          supabase test db --local supabase/tests/security_group_command_import_arrival.test.sql
          supabase test db --local supabase/tests/feedback_limits.test.sql
          supabase test db --local supabase/tests/installation_capabilities.test.sql
          node supabase/tests/promo_redemption_concurrency.mjs

  jsi-ui-runtime:
    needs: verify
    if: always() && needs.verify.outputs.product == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install clean patched native dependency
        run: npm ci
      - name: Exercise optimized UI and JavaScript actor contexts
        run: |
          python3 scripts/build-jsi-executor-probe.py "$RUNNER_TEMP/hither-jsi-probe" --host --release
          "$RUNNER_TEMP/hither-jsi-probe" ui many
          if "$RUNNER_TEMP/hither-jsi-probe" wrong > "$RUNNER_TEMP/hither-jsi-wrong.log" 2>&1; then
            echo "Unexpected acceptance of an arbitrary background thread"
            exit 1
          fi
          rg 'data race detected|JavaScriptActor operations must be run' "$RUNNER_TEMP/hither-jsi-wrong.log"

  # Turn a red build on the default branch into an actionable, deduped issue.
  open-issue:
    needs: [verify, jsi-ui-runtime]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `CI failed on master @ ${sha}`;
            const body = [
              `CI failed on \`master\` at commit ${context.sha}.`,
              ``,
              `**Run:** ${runUrl}`,
              ``,
              `@claude The CI pipeline (\`.github/workflows/ci.yml\`) is red. Open the run above,`,
              `read the failing step's logs, find the root cause, and open a PR that fixes it.`,
              `Gates are: jest, test:meta, test:coverage:changed, lint, tsc --noEmit, verify:runtime, expo install --check, expo-doctor, supabase test db (pgTAP). Keep the fix minimal.`,
            ].join("\n");
            // Dedupe: skip if an open ci-failure issue already exists for this sha.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "ci-failure", per_page: 50,
            });
            if (existing.data.some(i => i.title === title)) {
              core.info("Issue already open for this sha; skipping.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ["ci-failure", "claude-fix"],
            });
